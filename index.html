<!DOCTYPE html>
<html lang="pt-BR" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabana — Dashboard Pacotes 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cabana-green: #0A6B2C;
  --cabana-cream: #F6F0E1;
  --cabana-orange: #FF5028;
  --cabana-lime: #A8E067;
  --cabana-black: #0A0A0A;
}

body {
  background: var(--cabana-cream);
  color: var(--cabana-green);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* HEADER */
header {
  background: var(--cabana-green);
  color: var(--cabana-cream);
  padding: 14px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(10,107,44,0.3);
}
.wordmark {
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1px;
}
.wordmark sup { font-size: 0.5em; vertical-align: super; }
.header-center {
  text-align: center;
}
.header-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  opacity: 0.8;
}
.header-pill {
  border: 1.5px solid var(--cabana-cream);
  padding: 5px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* NAV */
nav {
  background: var(--cabana-green);
  padding: 0 24px;
  border-top: 1px solid rgba(246,240,225,0.15);
  display: flex;
  gap: 0;
  overflow-x: auto;
  flex-wrap: nowrap;
}
nav button {
  background: none;
  border: none;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: rgba(246,240,225,0.6);
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 1px;
}
nav button:hover { color: var(--cabana-cream); }
nav button.active {
  color: var(--cabana-lime);
  border-bottom-color: var(--cabana-lime);
}

/* MAIN */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 24px;
}
.page { display: none; }
.page.active { display: block; }

/* PAGE HERO */
.page-hero {
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 2px solid rgba(10,107,44,0.15);
}
.page-hero h1 {
  font-family: 'Georgia', serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1px;
  color: var(--cabana-black);
  line-height: 1;
}
.page-hero p {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.6;
  margin-top: 6px;
}

/* SECTION TITLE */
.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--cabana-green);
  opacity: 0.6;
  margin: 28px 0 12px;
  font-weight: 700;
}

/* GRID */
.grid { display: grid; gap: 12px; }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

/* CARD */
.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid rgba(10,107,44,0.1);
  box-shadow: 0 1px 4px rgba(10,107,44,0.06);
}
.card h3 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--cabana-green);
  opacity: 0.6;
  margin-bottom: 8px;
  font-weight: 700;
}
.card .val {
  font-size: 20px;
  font-weight: 900;
  color: var(--cabana-black);
  letter-spacing: -0.5px;
}
.card .sub {
  font-size: 11px;
  color: var(--cabana-green);
  opacity: 0.6;
  margin-top: 4px;
}

/* FAROL */
.farol-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  flex-shrink: 0;
}
.dot-green { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
.dot-yellow { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
.dot-red { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }

/* FAROL CARDS */
.farol-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  border-left: 4px solid;
  box-shadow: 0 1px 4px rgba(10,107,44,0.06);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.farol-card.fc-green { border-left-color: #10b981; }
.farol-card.fc-yellow { border-left-color: #f59e0b; }
.farol-card.fc-red { border-left-color: #ef4444; }
.farol-card .fc-name {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 700;
  color: var(--cabana-green);
  opacity: 0.7;
}
.farol-card .fc-val {
  font-size: 22px;
  font-weight: 900;
  color: var(--cabana-black);
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.farol-card .fc-sub {
  font-size: 11px;
  color: #6b7280;
}

/* BADGE */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.badge-green { background: rgba(16,185,129,0.12); color: #065f46; }
.badge-yellow { background: rgba(245,158,11,0.12); color: #92400e; }
.badge-red { background: rgba(239,68,68,0.12); color: #991b1b; }

/* TABLE */
.scroll-x { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 600px;
}
th, td {
  padding: 10px 12px;
  text-align: right;
  border-bottom: 1px solid rgba(10,107,44,0.08);
}
th:first-child, td:first-child { text-align: left; }
th {
  background: rgba(10,107,44,0.04);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--cabana-green);
  position: sticky;
  top: 0;
}
tbody tr:hover { background: rgba(10,107,44,0.03); }
tbody tr.total { background: rgba(10,107,44,0.05); font-weight: 700; }
.pos { color: #ef4444; }
.neg { color: #10b981; }

/* CHART */
.chart-wrap { position: relative; height: 260px; }
.chart-wrap-lg { position: relative; height: 340px; }

/* FILTERS */
.filters-bar {
  background: white;
  border-radius: 12px;
  padding: 14px 18px;
  border: 1px solid rgba(10,107,44,0.1);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 16px;
}
.fil-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fil-group label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--cabana-green);
  opacity: 0.7;
}
.fil-group select, .fil-group input {
  padding: 7px 10px;
  border: 1px solid rgba(10,107,44,0.2);
  border-radius: 6px;
  font-size: 12px;
  background: var(--cabana-cream);
  color: var(--cabana-black);
  min-width: 150px;
  outline: none;
}
.fil-group select:focus { border-color: var(--cabana-green); }
.btn-reset {
  padding: 7px 16px;
  background: var(--cabana-orange);
  color: var(--cabana-cream);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  align-self: flex-end;
}
.btn-reset:hover { opacity: 0.85; }

/* FOOTER */
footer {
  background: var(--cabana-orange);
  color: var(--cabana-cream);
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 60px;
}
footer .wm {
  font-family: 'Georgia', serif;
  font-size: 22px;
  font-weight: 900;
}
footer .tagline {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 3px;
  opacity: 0.85;
}

/* COMMENT BOX */
.comment-wrap {
  margin-top: 10px;
  border-top: 1px solid rgba(10,107,44,0.12);
  padding-top: 8px;
}
.comment-box {
  width: 100%;
  min-height: 52px;
  resize: vertical;
  border: 1px dashed rgba(10,107,44,0.25);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  font-family: 'Inter', sans-serif;
  color: var(--cabana-black);
  background: rgba(246,240,225,0.6);
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  line-height: 1.4;
}
.comment-box:focus {
  border-color: var(--cabana-green);
  background: var(--cabana-cream);
}
.comment-box::placeholder { color: rgba(10,107,44,0.4); }
.comment-ts {
  font-size: 9px;
  color: rgba(10,107,44,0.45);
  margin-top: 3px;
  text-align: right;
  letter-spacing: 0.5px;
}
.comment-saved-flash {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--cabana-green);
  color: var(--cabana-cream);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.comment-saved-flash.show { opacity: 1; }

.grid-5 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.mes-chk {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1.5px solid rgba(10,107,44,0.25);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  background: var(--cabana-cream);
  color: var(--cabana-green);
  transition: all 0.15s;
  user-select: none;
}
.mes-chk:has(input:checked) {
  background: var(--cabana-green);
  color: var(--cabana-cream);
  border-color: var(--cabana-green);
}
.mes-chk input[type=checkbox] { display: none; }

/* ── SLIDESHOW ── */
.slide-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 18px;
  border-radius: 999px;
  border: 1.5px solid var(--cabana-green);
  background: transparent;
  color: var(--cabana-green);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.2s;
}
.slide-btn:hover { background: var(--cabana-green); color: var(--cabana-cream); }

/* fullscreen overlay */
.slide-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--cabana-cream);
  z-index: 2000;
  flex-direction: column;
}
.slide-overlay.open { display: flex; }

/* top bar: green stripe */
.slide-topbar {
  background: var(--cabana-green);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 40px;
  flex-shrink: 0;
}
.slide-topbar-left {
  display: flex;
  align-items: baseline;
  gap: 18px;
}
.slide-topbar .wm {
  font-family: 'Georgia', serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--cabana-cream);
  letter-spacing: -0.5px;
}
.slide-topbar .slide-period {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: rgba(246,240,225,0.6);
  font-weight: 600;
}
.slide-close {
  background: rgba(246,240,225,0.1);
  border: 1.5px solid rgba(246,240,225,0.25);
  color: var(--cabana-cream);
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.slide-close:hover { background: rgba(246,240,225,0.2); }

/* title row */
.slide-title-row {
  padding: 28px 48px 16px;
  border-bottom: 2px solid rgba(10,107,44,0.1);
  flex-shrink: 0;
}
.slide-title-row h2 {
  font-family: 'Georgia', serif;
  font-size: clamp(18px, 2.5vw, 28px);
  font-weight: 900;
  color: var(--cabana-black);
  letter-spacing: -0.5px;
  margin: 0;
}
.slide-title-row p {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--cabana-green);
  opacity: 0.55;
  margin: 4px 0 0;
  font-weight: 600;
}

/* cards grid */
.slide-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 40px;
  overflow: auto;
}
.slide-cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 1280px;
}
@media (max-width: 1100px) { .slide-cards-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px)  { .slide-cards-grid { grid-template-columns: repeat(2, 1fr); } }

.slide-pkg-card {
  background: white;
  border-radius: 14px;
  padding: 20px 18px;
  border: 1px solid rgba(10,107,44,0.1);
  box-shadow: 0 2px 12px rgba(10,107,44,0.06);
  border-left: 5px solid;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.slide-pkg-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(10,107,44,0.12); }
.slide-pkg-card.fc-green  { border-left-color: #10b981; }
.slide-pkg-card.fc-yellow { border-left-color: #f59e0b; }
.slide-pkg-card.fc-red    { border-left-color: #ef4444; }

.spc-name {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--cabana-green);
  opacity: 0.65;
  line-height: 1.4;
}
.spc-val-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.spc-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.spc-dot.fc-green  { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
.spc-dot.fc-yellow { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); }
.spc-dot.fc-red    { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }

.spc-val {
  font-family: 'Georgia', serif;
  font-size: clamp(22px, 2.8vw, 34px);
  font-weight: 900;
  color: var(--cabana-black);
  letter-spacing: -1px;
  line-height: 1;
}
.spc-meta {
  font-size: 11px;
  color: #6b7280;
}
.spc-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  width: fit-content;
}
.spc-status.fc-green  { background: rgba(16,185,129,0.1);  color: #065f46; }
.spc-status.fc-yellow { background: rgba(245,158,11,0.1);  color: #92400e; }
.spc-status.fc-red    { background: rgba(239,68,68,0.1);   color: #991b1b; }

/* bottom bar */
.slide-footer-bar {
  background: var(--cabana-orange);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 40px;
  flex-shrink: 0;
}
.slide-footer-bar .tagline {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: rgba(246,240,225,0.8);
  font-weight: 600;
}
.slide-footer-bar .ts {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(246,240,225,0.7);
}

/* entry animation */
@keyframes slideIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.slide-animate { animation: slideIn 0.3s ease forwards; }




.btn-selall, .btn-clrmeses {
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-selall {
  border: 1.5px solid var(--cabana-green);
  background: transparent;
  color: var(--cabana-green);
}
.btn-selall:hover { background: var(--cabana-green); color: var(--cabana-cream); }
.btn-clrmeses {
  border: 1.5px solid var(--cabana-orange);
  background: transparent;
  color: var(--cabana-orange);
}
.btn-clrmeses:hover { background: var(--cabana-orange); color: var(--cabana-cream); }

</style>

<body>

<header>
  <div class="wordmark">Cabana<sup>®</sup></div>
  <div class="header-center">
    <div class="header-title">Dashboard de Pacotes — 2026</div>
  </div>
  <div class="header-pill">Burgers Reais</div>
</header>

<nav id="nav-tabs"></nav>

<main id="main-content"></main>

<footer>
  <div class="wm">Cabana<sup style="font-size:0.5em">®</sup></div>
  <div class="tagline">Controladoria · SP → RJ · 2026</div>

function farClass(real, meta) {
  if (!meta || meta <= 0) return 'yellow';

  if (r <= 1.0) return 'green';
  if (r <= 1.10) return 'yellow';
  return 'red';
}

const pages = [{key:'dash', label:'📊 Dashboard Geral'}].concat(PKGS.map(p=>({key:p.key, label:p.label})));

pages.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.textContent = p.label;
  btn.dataset.key = p.key;
  if (i === 0) btn.classList.add('active');
  btn.onclick = () => switchPage(p.key);
  nav.appendChild(btn);
});

function switchPage(key) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'pg-' + key));
}

// ====== DASHBOARD PAGE ======
function buildDash() {
  const pg = document.createElement('div');
  pg.className = 'page active';
  pg.id = 'pg-dash';

  // Compute totals
  const LM = 3; // last complete month index (Abril)
  let totMeta = 0, totReal = 0;
  PKGS.forEach(p => {
    for (let i = 0; i <= LM; i++) {
      totMeta += DATA.meta[p.key].meta[i];
      totReal += DATA.meta[p.key].real[i];
    }
  });
  const varTot = totReal - totMeta;
  const fTot = farClass(totReal, totMeta);

  pg.innerHTML = `
    <div class="page-hero">
      <h1>Dashboard Pacotes 2026</h1>
      <p>Última atualização: Abril 2026 · Competência Jan–Abr</p>
    </div>

    <div class="grid grid-5">
      <div class="card" style="border-left:4px solid var(--cabana-orange)">
        <h3>Meta Total 2026</h3>
        <div class="val" style="color:var(--cabana-orange)">${fmt(PKGS.reduce((a,p) => a + DATA.meta[p.key].meta.reduce((s,v)=>s+v,0), 0))}</div>
        <div class="sub">8 pacotes · Jan–Dez 2026</div>
      </div>
      <div class="card">
        <h3>Meta YTD (Jan–Abr)</h3>
        <div class="val">${fmt(totMeta)}</div>
        <div class="sub">8 pacotes combinados</div>
      </div>
      <div class="card">
        <h3>Realizado YTD</h3>
        <div class="val">${fmt(totReal)}</div>
        <div class="sub">${pct(totReal, totMeta)} da meta YTD</div>
      </div>
      <div class="card">
        <h3>Variação YTD</h3>
        <div class="val ${varTot > 0 ? 'pos' : 'neg'}">${varTot > 0 ? '+' : ''}${fmt(varTot)}</div>
        <div class="sub">${varTot > 0 ? 'Acima do orçado' : 'Dentro do orçado'}</div>
      </div>
      <div class="card">
        <h3>Status Consolidado</h3>
        <div class="val"><span class="farol-dot dot-${fTot}"></span>${farLabelShort(fTot)}</div>
        <div class="sub">${fTot === 'green' ? 'Gasto controlado' : fTot === 'yellow' ? 'Monitorar de perto' : 'Revisão necessária'}</div>
      </div>
    </div>

    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>Farol YTD — Janeiro a Abril 2026</span>
      <button class="slide-btn" onclick="openSlide()">▶ Apresentar Faróis</button>
    </div>
    <div class="grid grid-4" id="farol-ytd"></div>

    <div class="section-title" style="margin-top:28px;display:flex;align-items:center;justify-content:space-between">
      <span>Farol Mês a Mês — Todos os Pacotes</span>
      <button class="slide-btn" onclick="openSlide()">▶ Apresentar</button>
    </div>
    <div class="filters-bar" style="margin-bottom:12px">
      <div class="fil-group">
        <label>Selecionar Meses (múltipla seleção)</label>
        <div id="dash-mes-checks" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px">
          <label class="mes-chk"><input type="checkbox" value="0" onchange="renderDashMes()"> Jan</label>
          <label class="mes-chk"><input type="checkbox" value="1" onchange="renderDashMes()"> Fev</label>
          <label class="mes-chk"><input type="checkbox" value="2" onchange="renderDashMes()"> Mar</label>
          <label class="mes-chk active-chk"><input type="checkbox" value="3" checked onchange="renderDashMes()"> Abr ✓</label>
          <label class="mes-chk"><input type="checkbox" value="4" onchange="renderDashMes()"> Mai</label>
          <label class="mes-chk"><input type="checkbox" value="5" onchange="renderDashMes()"> Jun</label>
          <label class="mes-chk"><input type="checkbox" value="6" onchange="renderDashMes()"> Jul</label>
          <label class="mes-chk"><input type="checkbox" value="7" onchange="renderDashMes()"> Ago</label>
          <label class="mes-chk"><input type="checkbox" value="8" onchange="renderDashMes()"> Set</label>
          <label class="mes-chk"><input type="checkbox" value="9" onchange="renderDashMes()"> Out</label>
          <label class="mes-chk"><input type="checkbox" value="10" onchange="renderDashMes()"> Nov</label>
          <label class="mes-chk"><input type="checkbox" value="11" onchange="renderDashMes()"> Dez</label>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;align-self:flex-end;padding-bottom:4px">
        <button class="btn-selall" onclick="selectAllMeses()">✓ Todos</button>
        <button class="btn-clrmeses" onclick="clearMeses()">✕ Limpar</button>
        <span style="font-size:11px;color:var(--cabana-green);opacity:0.6">Selecione um ou mais meses</span>
      </div>
    </div>
    <div id="farol-mes-wrap">
      <div class="grid grid-4" id="farol-mes"></div>

      <div style="margin-top:16px" class="card scroll-x">
        <table id="tbl-dash-mes">
          <thead></thead><tbody></tbody>
        </table>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Meta × Realizado — Mês Selecionado</h3>
        <div class="chart-wrap-lg"><canvas id="chart-mes-bar"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin-top:32px">Resumo Executivo — YTD por Pacote</div>
    <div class="card scroll-x">
      <table>
        <thead><tr>
          <th>Pacote</th>
          <th>Meta YTD</th><th>Realizado YTD</th><th>Var. YTD</th><th>Status YTD</th>
        </tr></thead>
        <tbody id="tbl-dash-body"></tbody>
      </table>
    </div>

    <div class="grid grid-2" style="margin-top:16px">
      <div class="card">
        <h3 style="font-size:11px;margin-bottom:12px">Meta × Realizado YTD por Pacote</h3>
        <div class="chart-wrap-lg"><canvas id="chart-ytd-bar"></canvas></div>
      </div>
      <div class="card">
        <h3 style="font-size:11px;margin-bottom:12px">Distribuição do Gasto YTD</h3>
        <div class="chart-wrap-lg"><canvas id="chart-pie"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin-top:32px">Comparativo Geral — 2025 × 2026 (Jan–Abr YTD)</div>
    <div class="grid grid-2">
      <div class="card">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">2025 × 2026 por Pacote (YTD Jan–Abr)</h3>
        <div class="chart-wrap-lg"><canvas id="chart-cmp-dash"></canvas></div>
      </div>
      <div class="card scroll-x">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Tabela Comparativa YTD</h3>
        <table>
          <thead><tr>
            <th>Pacote</th><th>2025 YTD</th><th>2026 Meta</th><th>2026 Real</th><th>Δ vs 2025</th><th>Δ vs Meta</th>
          </tr></thead>
          <tbody id="tbl-cmp-dash"></tbody>
        </table>
      </div>
    </div>

    <div class="section-title" style="margin-top:28px">2025 Total Anual × 2026 — Progresso do Ano</div>
    <div class="card scroll-x">
      <table>
        <thead><tr>
          <th>Pacote</th>
          <th>2025 Total Ano</th>
          <th>2026 Meta Ano</th>
          <th>2026 Real YTD</th>
          <th>% Exec. vs 2025</th>
          <th>% Exec. vs Meta</th>
        </tr></thead>
        <tbody id="tbl-cmp-anual"></tbody>
      </table>
    </div>
  `;
  main.appendChild(pg);

  const fYtdEl = pg.querySelector('#farol-ytd');
  const tbody = pg.querySelector('#tbl-dash-body');

  const colors = ['#0A6B2C','#A8E067','#FF5028','#2563eb','#f59e0b','#8b5cf6','#ec4899','#14b8a6'];

  // YTD section
  const ytdData = PKGS.map((p, idx) => {
    const m = DATA.meta[p.key];
    let mYtd = 0, rYtd = 0;
    for (let i = 0; i <= LM; i++) { mYtd += m.meta[i]; rYtd += m.real[i]; }
    const fY = farClass(rYtd, mYtd);

    const ytdComKey = 'comment_ytd_' + p.key;
    const ytdComVal = localStorage.getItem(ytdComKey) || '';
    const ytdComTs = localStorage.getItem(ytdComKey + '_ts') || '';
    fYtdEl.insertAdjacentHTML('beforeend', `
      <div class="farol-card fc-${fY}">
        <div class="fc-name">${p.full}</div>
        <div class="fc-val"><span class="farol-dot dot-${fY}"></span>${fmtK(rYtd)}</div>
        <div class="fc-sub">Meta: ${fmtK(mYtd)} &nbsp;|&nbsp; ${pct(rYtd, mYtd)}</div>
        <div class="comment-wrap">
          <textarea class="comment-box" placeholder="✏️ Comentário YTD..." data-key="${ytdComKey}" onblur="saveComment(this)">${ytdComVal}</textarea>
          ${ytdComTs ? `<div class="comment-ts">${ytdComTs}</div>` : ''}
        </div>
      </div>`);

    const vY = rYtd - mYtd;
    tbody.insertAdjacentHTML('beforeend', `
      <tr>
        <td><strong>${p.full}</strong></td>
        <td>${fmt(mYtd)}</td><td>${fmt(rYtd)}</td>
        <td class="${vY > 0 ? 'pos' : 'neg'}">${vY > 0 ? '+' : ''}${fmt(vY)}</td>
        <td><span class="badge badge-${fY}">${farLabelShort(fY)}</span></td>
      </tr>`);

    return { label: p.label, meta: mYtd, real: rYtd, color: colors[idx % colors.length] };
  });

  // YTD total row
  tbody.insertAdjacentHTML('beforeend', `
    <tr class="total">
      <td>TOTAL GERAL</td>
      <td>${fmt(totMeta)}</td><td>${fmt(totReal)}</td>
      <td class="${varTot > 0 ? 'pos' : 'neg'}">${varTot > 0 ? '+' : ''}${fmt(varTot)}</td>
      <td><span class="badge badge-${fTot}">${farLabelShort(fTot)}</span></td>
    </tr>`);

  // ---- MÊS A MÊS RENDER ----
  let mesBarChart = null;
  window.renderDashMes = function() {
    const checked = [...document.querySelectorAll('#dash-mes-checks input:checked')].map(c => parseInt(c.value));
    if (checked.length === 0) return;
    const selLabel = checked.map(i => MONTHS[i]).join(', ');
    const fMesEl = document.getElementById('farol-mes');
    fMesEl.innerHTML = '';

    const mesData = PKGS.map((p, idx) => {
      const m = DATA.meta[p.key];
      const mMes = checked.reduce((a, i) => a + m.meta[i], 0);
      const rMes = checked.reduce((a, i) => a + m.real[i], 0);
      const fc = farClass(rMes, mMes);
      const mesComKey = 'comment_mes_' + p.key + '_' + checked.join('-');
      const mesComVal = localStorage.getItem(mesComKey) || '';
      const mesComTs = localStorage.getItem(mesComKey + '_ts') || '';
      fMesEl.insertAdjacentHTML('beforeend', `
        <div class="farol-card fc-${fc}">
          <div class="fc-name" style="cursor:pointer" onclick="switchPage('${p.key}')">${p.full} ↗</div>
          <div class="fc-val"><span class="farol-dot dot-${fc}"></span>${fmtK(rMes)}</div>
          <div class="fc-sub">Meta: ${fmtK(mMes)} &nbsp;|&nbsp; ${pct(rMes, mMes)}</div>
          <div class="comment-wrap">
            <textarea class="comment-box" placeholder="✏️ Comentário ${selLabel}..." data-key="${mesComKey}" onblur="saveComment(this)">${mesComVal}</textarea>
            ${mesComTs ? `<div class="comment-ts">${mesComTs}</div>` : ''}
          </div>
        </div>`);
      return { label: p.label, meta: mMes, real: rMes, color: colors[idx] };
    });

    // Table mes
    const tblMes = document.getElementById('tbl-dash-mes');
    tblMes.querySelector('thead').innerHTML = `<tr>
      <th>Pacote</th><th>Meta (${selLabel})</th><th>Realizado (${selLabel})</th>
      <th>Variação</th><th>%</th><th>Status</th>
    </tr>`;
    const tbodyM = tblMes.querySelector('tbody');
    tbodyM.innerHTML = '';
    let totMetaM = 0, totRealM = 0;
    mesData.forEach(d => {
      const v = d.real - d.meta;
      const fc = farClass(d.real, d.meta);
      totMetaM += d.meta; totRealM += d.real;
      tbodyM.insertAdjacentHTML('beforeend', `
        <tr>
          <td><strong>${PKGS.find(p=>p.label===d.label).full}</strong></td>
          <td>${fmt(d.meta)}</td>
          <td>${fmt(d.real)}</td>
          <td class="${v>0?'pos':'neg'}">${v>0?'+':''}${fmt(v)}</td>
          <td class="${v>0?'pos':'neg'}">${pct(d.real,d.meta)}</td>
          <td><span class="badge badge-${fc}">${farLabelShort(fc)}</span></td>
        </tr>`);
    });
    const vT = totRealM - totMetaM, fcT = farClass(totRealM, totMetaM);
    tbodyM.insertAdjacentHTML('beforeend', `
      <tr class="total">
        <td>TOTAL</td><td>${fmt(totMetaM)}</td><td>${fmt(totRealM)}</td>
        <td class="${vT>0?'pos':'neg'}">${vT>0?'+':''}${fmt(vT)}</td>
        <td class="${vT>0?'pos':'neg'}">${pct(totRealM,totMetaM)}</td>
        <td><span class="badge badge-${fcT}">${farLabelShort(fcT)}</span></td>
      </tr>`);

    // Bar chart mês
    if (mesBarChart) mesBarChart.destroy();
    mesBarChart = new Chart(document.getElementById('chart-mes-bar'), {
      type: 'bar',
      data: {
        labels: mesData.map(d => d.label),
        datasets: [
          { label: 'Meta', data: mesData.map(d => d.meta), backgroundColor: 'rgba(10,107,44,0.2)', borderColor: '#0A6B2C', borderWidth: 2, borderRadius: 4 },
          { label: 'Realizado', data: mesData.map(d => d.real), backgroundColor: mesData.map(d => {
            const f = farClass(d.real, d.meta);
            return f==='green'?'rgba(16,185,129,0.85)':f==='yellow'?'rgba(245,158,11,0.85)':'rgba(239,68,68,0.85)';
          }), borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { size: 11 } } },
          title: { display: true, text: selLabel + ' 2026 — Meta × Realizado', font: { size: 12, weight: '600' }, color: '#0A6B2C' } },
        scales: { y: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.08)' } } }
      }
    });
  };
  renderDashMes(); // render com mês padrão (Abril)

  // Charts YTD
  new Chart(pg.querySelector('#chart-ytd-bar'), {
    type: 'bar',
    data: {
      labels: ytdData.map(d => d.label),
      datasets: [
        { label: 'Meta YTD', data: ytdData.map(d => d.meta), backgroundColor: 'rgba(10,107,44,0.25)', borderColor: '#0A6B2C', borderWidth: 2, borderRadius: 4 },
        { label: 'Realizado YTD', data: ytdData.map(d => d.real), backgroundColor: ytdData.map(d => {
          const f = farClass(d.real, d.meta);
          return f === 'green' ? 'rgba(16,185,129,0.85)' : f === 'yellow' ? 'rgba(245,158,11,0.85)' : 'rgba(239,68,68,0.85)';
        }), borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
      scales: { y: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.08)' } } }
    }
  });

  new Chart(pg.querySelector('#chart-pie'), {
    type: 'doughnut',
    data: {
      labels: ytdData.map(d => d.label),
      datasets: [{ data: ytdData.map(d => d.real), backgroundColor: colors, borderWidth: 2, borderColor: '#F6F0E1' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + fmt(ctx.raw) } }
      },
      cutout: '58%'
    }
  });

  // ── Dashboard Comparativo 2025 × 2026 ────────────────────────────────
  const LM2 = 3;
  const months4 = [0,1,2,3];
  const cmpRows = PKGS.map(p => {
    const ytd25 = months4.reduce((a, i) => a + (DATA.meta[p.key].real2025[i] || 0), 0);
    const ytdMeta = months4.reduce((a, i) => a + DATA.meta[p.key].meta[i], 0);
    const ytdReal = months4.reduce((a, i) => a + DATA.meta[p.key].real[i], 0);
    return { label: p.label, full: p.full, ytd25, ytdMeta, ytdReal };
  });

  new Chart(pg.querySelector('#chart-cmp-dash'), {
    type: 'bar',
    data: {
      labels: cmpRows.map(r => r.label),
      datasets: [
        { label: '2025 YTD',    data: cmpRows.map(r => r.ytd25),    backgroundColor: 'rgba(10,107,44,0.3)',  borderColor: '#0A6B2C', borderWidth: 1.5, borderRadius: 4 },
        { label: '2026 Meta',   data: cmpRows.map(r => r.ytdMeta),  backgroundColor: 'rgba(255,80,40,0.2)', borderColor: '#FF5028', borderWidth: 1.5, borderRadius: 4 },
        { label: '2026 Real',   data: cmpRows.map(r => r.ytdReal),  backgroundColor: cmpRows.map(r => farClass(r.ytdReal, r.ytdMeta) === 'green' ? 'rgba(16,185,129,0.85)' : farClass(r.ytdReal, r.ytdMeta) === 'yellow' ? 'rgba(245,158,11,0.85)' : 'rgba(239,68,68,0.85)'), borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } },
      scales: { y: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.06)' } } }
    }
  });

  const tbodyCmpDash = pg.querySelector('#tbl-cmp-dash');
  let tot25d = 0, totMd = 0, totRd = 0;
  cmpRows.forEach(r => {
    tot25d += r.ytd25; totMd += r.ytdMeta; totRd += r.ytdReal;
    const d25 = r.ytdReal - r.ytd25, dM = r.ytdReal - r.ytdMeta;
    tbodyCmpDash.insertAdjacentHTML('beforeend', `<tr>
      <td><strong>${r.full}</strong></td>
      <td>${fmt(r.ytd25)}</td>
      <td>${fmt(r.ytdMeta)}</td>
      <td>${r.ytdReal > 0 ? fmt(r.ytdReal) : '<span style="color:#d1d5db">—</span>'}</td>
      <td><span class="${d25 > 0 ? 'pos' : 'neg'}">${d25 > 0 ? '+' : ''}${fmt(d25)}</span></td>
      <td>${r.ytdReal > 0 ? '<span class="' + (dM > 0 ? 'pos' : 'neg') + '">' + (dM > 0 ? '+' : '') + fmt(dM) + '</span>' : '<span style="color:#d1d5db">—</span>'}</td>
    </tr>`);
  });
  const d25Tot = totRd - tot25d, dMTot = totRd - totMd;
  tbodyCmpDash.insertAdjacentHTML('beforeend', `<tr class="total">
    <td>TOTAL GERAL</td>
    <td>${fmt(tot25d)}</td><td>${fmt(totMd)}</td><td>${fmt(totRd)}</td>
    <td><span class="${d25Tot > 0 ? 'pos' : 'neg'}">${d25Tot > 0 ? '+' : ''}${fmt(d25Tot)}</span></td>
    <td><span class="${dMTot > 0 ? 'pos' : 'neg'}">${dMTot > 0 ? '+' : ''}${fmt(dMTot)}</span></td>
  </tr>`);

  // ── Tabela 2025 Total Anual × 2026 ───────────────────────────────────
  const tbodyCmpAnual = pg.querySelector('#tbl-cmp-anual');
  let tot25a = 0, totM26a = 0, totR26a = 0;
  cmpRows.forEach(r => {
    const total25 = DATA.meta[PKGS.find(p => p.label === r.label).key].real2025.reduce((a,v) => a+v, 0);
    const meta26a = DATA.meta[PKGS.find(p => p.label === r.label).key].meta.reduce((a,v) => a+v, 0);
    tot25a += total25; totM26a += meta26a; totR26a += r.ytdReal;
    const pctOf25  = total25 > 0 ? ((r.ytdReal / total25) * 100).toFixed(1).replace('.',',') + '%' : '—';
    const pctOfMeta = meta26a > 0 ? ((r.ytdReal / meta26a) * 100).toFixed(1).replace('.',',') + '%' : '—';
    tbodyCmpAnual.insertAdjacentHTML('beforeend', `<tr>
      <td><strong>${r.full}</strong></td>
      <td>${fmt(total25)}</td>
      <td>${fmt(meta26a)}</td>
      <td>${r.ytdReal > 0 ? fmt(r.ytdReal) : '<span style="color:#d1d5db">—</span>'}</td>
      <td>${r.ytdReal > 0 ? '<span style="font-weight:600;color:var(--cabana-green)">' + pctOf25 + '</span>' : '<span style="color:#d1d5db">—</span>'}</td>
      <td>${r.ytdReal > 0 ? '<span style="font-weight:600;color:var(--cabana-green)">' + pctOfMeta + '</span>' : '<span style="color:#d1d5db">—</span>'}</td>
    </tr>`);
  });
  const pctTot25 = tot25a > 0 ? ((totR26a/tot25a)*100).toFixed(1).replace('.',',')+'%' : '—';
  const pctTotM  = totM26a > 0 ? ((totR26a/totM26a)*100).toFixed(1).replace('.',',')+'%' : '—';
  tbodyCmpAnual.insertAdjacentHTML('beforeend', `<tr class="total">
    <td>TOTAL GERAL</td>
    <td>${fmt(tot25a)}</td><td>${fmt(totM26a)}</td><td>${fmt(totR26a)}</td>
    <td><span style="font-weight:700;color:var(--cabana-green)">${pctTot25}</span></td>
    <td><span style="font-weight:700;color:var(--cabana-green)">${pctTotM}</span></td>
  </tr>`);
}

// ====== PACKAGE PAGES ======
const chartStore = {};

// which pkgs have filial filter
const PKG_WITH_FILIAL = ['ecolab','lalamove','epi','uniformes','utensilios','taxi'];
const PKG_TAXI_CC     = ['taxi'];
const PKG_COLLAB      = ['reembolso'];

function buildPackagePage(p) {
  const pg = document.createElement('div');
  pg.className = 'page';
  pg.id = 'pg-' + p.key;

  const rows = DATA.aggregated[p.key] || [];
  const suppliers = [...new Set(rows.map(r => r.fornecedor))].sort();

  const m = DATA.meta[p.key];

  const hasFilial  = PKG_WITH_FILIAL.includes(p.key);
  const hasCollab  = PKG_COLLAB.includes(p.key);
  const isTaxi     = PKG_TAXI_CC.includes(p.key);

  const fornecLabel = hasCollab ? 'Colaborador' : 'Fornecedor';
  const filialHtml  = (hasFilial || isTaxi) ? `
      <div class="fil-group">
        <label>Filial</label>
        <select id="ff-${p.key}">
          <option value="">Todas (${filiais.length})</option>
          ${filiais.map(f => `<option value="${f.replace(/"/g,'&quot;')}">${f}</option>`).join('')}
        </select>
      </div>` : '';

  const solicitantes = isTaxi ? [...new Set(rows.map(r => r.solicitante).filter(Boolean))].sort() : [];
  const solicitanteHtml = isTaxi ? `
      <div class="fil-group">
        <label>Solicitante</label>
        <select id="fsol-${p.key}">
          <option value="">Todos (${solicitantes.length})</option>
          ${solicitantes.map(s => `<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('')}
        </select>
      </div>` : '';

  pg.innerHTML = `
    <div class="page-hero">
      <h1>${p.full}</h1>
      <p>Acompanhamento de meta × realizado · 2026</p>
    </div>

    <div class="filters-bar">
      ${isTaxi ? '' : `<div class="fil-group">
        <label>${fornecLabel}</label>
        <select id="fs-${p.key}">
          <option value="">Todos (${suppliers.length})</option>
          ${suppliers.map(s => `<option value="${s.replace(/"/g,'&quot;')}">${s}</option>`).join('')}
        </select>
      </div>`}
      ${filialHtml}
      <div class="fil-group">
        <label>Mês Inicial</label>
        <select id="fmin-${p.key}">
          ${MONTHS.map((mn,i) => `<option value="${i}">${mn}</option>`).join('')}
        </select>
      </div>
      <div class="fil-group">
        <label>Mês Final</label>
        <select id="fmax-${p.key}">
          ${MONTHS.map((mn,i) => `<option value="${i}" ${i===3?'selected':''}>${mn}</option>`).join('')}
        </select>
      </div>
      ${solicitanteHtml}
      <button class="btn-reset" onclick="resetPkg('${p.key}')">↺ Limpar</button>
    </div>

    <div class="grid grid-5" id="kpi-${p.key}"></div>

    <div class="grid grid-2" style="margin-top:16px">
      <div class="card">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Meta × Realizado por Mês</h3>
        <div class="chart-wrap"><canvas id="cmes-${p.key}"></canvas></div>
      </div>
      <div class="card">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Top Fornecedores / Centros de Custo</h3>
        <div class="chart-wrap"><canvas id="csup-${p.key}"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin-top:28px">Comparativo 2025 × 2026 — Mês a Mês</div>
    <div class="grid grid-2">
      <div class="card">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Realizado 2025 × 2026 (Jan–Dez)</h3>
        <div class="chart-wrap-lg"><canvas id="ccmp-${p.key}"></canvas></div>
      </div>
      <div class="card scroll-x">
        <h3 style="font-size:10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px">Tabela Comparativa</h3>
        <table id="tblcmp-${p.key}">
          <thead><tr>
            <th>Mês</th><th>2025</th><th>2026 Meta</th><th>2026 Real</th><th>Δ vs 2025</th><th>Δ vs Meta</th>
          </tr></thead>
          <tbody id="tbodycmp-${p.key}"></tbody>
        </table>
      </div>
    </div>

    <div class="section-title" style="margin-top:24px">Breakdown por Fornecedor × Mês</div>
    <div class="card scroll-x">
      <table id="tbl-${p.key}"><thead></thead><tbody></tbody></table>
    </div>
  `;
  main.appendChild(pg);

  ['fs-','fmin-','fmax-'].forEach(pref => {
    const el = pg.querySelector('#' + pref + p.key);
    if (el) el.onchange = () => renderPkg(p);
  });
  const ffEl = pg.querySelector('#ff-' + p.key);
  if (ffEl) ffEl.onchange = () => renderPkg(p);
  const fsolEl = pg.querySelector('#fsol-' + p.key);
  if (fsolEl) fsolEl.onchange = () => renderPkg(p);
  renderPkg(p);
}

window.resetPkg = function(key) {
  const fsEl0 = document.getElementById('fs-' + key); if (fsEl0) fsEl0.value = '';
  document.getElementById('fmin-' + key).value = '0';
  document.getElementById('fmax-' + key).value = '3';
  const ffEl = document.getElementById('ff-' + key);
  if (ffEl) ffEl.value = '';
  const fsolEl2 = document.getElementById('fsol-' + key);
  if (fsolEl2) fsolEl2.value = '';
  renderPkg(PKGS.find(p => p.key === key));
};

function renderPkg(p) {
  const _fsEl = document.getElementById('fs-' + p.key);
  const sup    = _fsEl ? _fsEl.value : '';
  const _fminEl = document.getElementById('fmin-' + p.key);
  const mMin   = _fminEl ? parseInt(_fminEl.value) : 0;
  const _fmaxEl = document.getElementById('fmax-' + p.key);
  const mMax   = _fmaxEl ? parseInt(_fmaxEl.value) : 3;
  const ffEl      = document.getElementById('ff-' + p.key);
  const filial    = ffEl ? ffEl.value : '';
  const fsolEl    = document.getElementById('fsol-' + p.key);
  const solicitante = fsolEl ? fsolEl.value : '';
  const m = DATA.meta[p.key];
  const filtered = (DATA.aggregated[p.key] || []).filter(r =>
    r.mes >= mMin && r.mes <= mMax &&
    (!sup        || r.fornecedor  === sup) &&
    (!filial     || r.filial      === filial) &&
    (!solicitante|| r.solicitante === solicitante)
  );

  let metaPer = 0, realPer = 0;
  for (let i = mMin; i <= mMax; i++) { metaPer += m.meta[i]; realPer += m.real[i]; }
  if (sup || filial || solicitante) realPer = filtered.reduce((a, b) => a + b.valor, 0);

  const varPer = realPer - metaPer;
  const fc = farClass(realPer, metaPer);
  const metaAnual = m.meta.reduce((a, b) => a + b, 0);
  const realYtdTotal = m.real.reduce((a, b) => a + b, 0);
  const pctAnual = metaAnual > 0 ? ((realYtdTotal / metaAnual) * 100).toFixed(1).replace('.', ',') + '%' : '—';
  const kpiEl = document.getElementById('kpi-' + p.key);
  kpiEl.innerHTML = `
    <div class="card" style="border-left:4px solid var(--cabana-orange)">
      <h3>Meta Total do Ano</h3>
      <div class="val" style="color:var(--cabana-orange)">${fmt(metaAnual)}</div>
      <div class="sub">Jan – Dez 2026 · 12 meses</div>
      <div class="sub" style="margin-top:4px">Consumido YTD: ${pctAnual}</div>
    </div>
    <div class="farol-card fc-${fc}">
      <div class="fc-name">Meta do Período</div>
      <div class="fc-val">${fmt(metaPer)}</div>
      <div class="fc-sub">${MONTHS[mMin]}${mMin!==mMax?' – '+MONTHS[mMax]:''} · ${mMax-mMin+1} mês${mMax!==mMin?'es':''}</div>
    </div>
    <div class="farol-card fc-${fc}">
      <div class="fc-name">Realizado${sup ? ' (Filtrado)' : ''}</div>
      <div class="fc-val"><span class="farol-dot dot-${fc}"></span>${fmt(realPer)}</div>
      <div class="fc-sub">${pct(realPer, metaPer)} da meta do período</div>
    </div>
    <div class="card">
      <h3>Variação</h3>
      <div class="val ${varPer > 0 ? 'pos' : 'neg'}">${varPer > 0 ? '+' : ''}${fmt(varPer)}</div>
      <div class="sub">${varPer > 0 ? 'Acima do orçado' : 'Dentro do orçado'}</div>
    </div>`;

  // Charts
  const monthLabels = [], metaArr = [], realArr = [];
  for (let i = mMin; i <= mMax; i++) {
    monthLabels.push(MONTHS[i]);
    metaArr.push(m.meta[i]);
    realArr.push(sup
      ? filtered.filter(r => r.mes === i).reduce((a, b) => a + b.valor, 0)
      : m.real[i]
    );
  }

  if (chartStore['m' + p.key]) chartStore['m' + p.key].destroy();
  chartStore['m' + p.key] = new Chart(document.getElementById('cmes-' + p.key), {
    type: 'bar',
    data: {
      labels: monthLabels,
      datasets: [
        { label: 'Meta', data: metaArr, backgroundColor: 'rgba(10,107,44,0.2)', borderColor: '#0A6B2C', borderWidth: 2, borderRadius: 4 },
        { label: 'Realizado', data: realArr, backgroundColor: realArr.map((v,i) => {
          const f = farClass(v, metaArr[i]);
          return f === 'green' ? 'rgba(16,185,129,0.85)' : f === 'yellow' ? 'rgba(245,158,11,0.85)' : 'rgba(239,68,68,0.85)';
        }), borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } },
      scales: { y: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.08)' } } }
    }
  });

  // For cross-filter: top chart shows breakdown by filial when available, else by supplier
  const hasFil = ['ecolab','lalamove','epi','uniformes','utensilios','taxi'].includes(p.key);
  const supTotals = {};
  filtered.forEach(r => {
    const groupKey = (hasFil && !filial) ? (r.filial || r.fornecedor) : r.fornecedor;
    supTotals[groupKey] = (supTotals[groupKey] || 0) + r.valor;
  });
  const top10 = Object.entries(supTotals).sort((a, b) => b[1] - a[1]).slice(0, 10);

  if (chartStore['s' + p.key]) chartStore['s' + p.key].destroy();
  chartStore['s' + p.key] = new Chart(document.getElementById('csup-' + p.key), {
    type: 'bar',
    data: {
      labels: top10.map(e => e[0].length > 32 ? e[0].slice(0, 30) + '…' : e[0]),
      datasets: [{ label: 'Realizado', data: top10.map(e => e[1]),
        backgroundColor: 'rgba(10,107,44,0.75)', borderRadius: 4 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.08)' } },
                y: { ticks: { font: { size: 9 } } } }
    }
  });

  // ── Comparativo 2025 × 2026 ──────────────────────────────────────────
  const m2025 = DATA.meta[p.key].real2025 || Array(12).fill(0);
  const mMeta = DATA.meta[p.key].meta;
  const mReal = DATA.meta[p.key].real;
  const allMonths = MONTHS;

  if (chartStore['cmp' + p.key]) chartStore['cmp' + p.key].destroy();
  chartStore['cmp' + p.key] = new Chart(document.getElementById('ccmp-' + p.key), {
    type: 'bar',
    data: {
      labels: allMonths,
      datasets: [
        { label: '2025 Realizado', data: m2025, backgroundColor: 'rgba(10,107,44,0.25)', borderColor: '#0A6B2C', borderWidth: 1.5, borderRadius: 3 },
        { label: '2026 Meta',      data: mMeta,  backgroundColor: 'rgba(255,80,40,0.15)', borderColor: '#FF5028', borderWidth: 1.5, borderRadius: 3, borderDash: [4,4] },
        { label: '2026 Realizado', data: mReal,  backgroundColor: mReal.map((v,i) => v > 0 ? (farClass(v, mMeta[i]) === 'green' ? 'rgba(16,185,129,0.85)' : farClass(v, mMeta[i]) === 'yellow' ? 'rgba(245,158,11,0.85)' : 'rgba(239,68,68,0.85)') : 'rgba(0,0,0,0)'), borderRadius: 3 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } },
      scales: { y: { ticks: { callback: v => fmtK(v), font: { size: 10 } }, grid: { color: 'rgba(10,107,44,0.06)' } } }
    }
  });

  // Comparativo table
  const tbodyCmp = document.getElementById('tbodycmp-' + p.key);
  tbodyCmp.innerHTML = '';
  let tot25 = 0, totMeta26 = 0, totReal26 = 0;
  allMonths.forEach((mn, i) => {
    const v25 = m2025[i], vm = mMeta[i], vr = mReal[i];
    tot25 += v25; totMeta26 += vm; totReal26 += vr;
    const dVs25 = vr > 0 ? vr - v25 : null;
    const dVsMeta = vr > 0 ? vr - vm : null;
    const hasReal = vr > 0;
    tbodyCmp.insertAdjacentHTML('beforeend', `<tr>
      <td><strong>${mn}</strong></td>
      <td>${v25 > 0 ? fmt(v25) : '<span style="color:#d1d5db">—</span>'}</td>
      <td>${fmt(vm)}</td>
      <td>${hasReal ? fmt(vr) : '<span style="color:#d1d5db">—</span>'}</td>
      <td>${dVs25 !== null ? '<span class="' + (dVs25 > 0 ? 'pos' : 'neg') + '">' + (dVs25 > 0 ? '+' : '') + fmt(dVs25) + '</span>' : '<span style="color:#d1d5db">—</span>'}</td>
      <td>${dVsMeta !== null ? '<span class="' + (dVsMeta > 0 ? 'pos' : 'neg') + '">' + (dVsMeta > 0 ? '+' : '') + fmt(dVsMeta) + '</span>' : '<span style="color:#d1d5db">—</span>'}</td>
    </tr>`);
  });
  const dTot25 = totReal26 > 0 ? totReal26 - tot25 : null;
  const dTotMeta = totReal26 > 0 ? totReal26 - totMeta26 : null;
  tbodyCmp.insertAdjacentHTML('beforeend', `<tr class="total">
    <td>TOTAL</td>
    <td>${fmt(tot25)}</td>
    <td>${fmt(totMeta26)}</td>
    <td>${totReal26 > 0 ? fmt(totReal26) : '<span style="color:#d1d5db">—</span>'}</td>
    <td>${dTot25 !== null ? '<span class="' + (dTot25 > 0 ? 'pos' : 'neg') + '">' + (dTot25 > 0 ? '+' : '') + fmt(dTot25) + '</span>' : '—'}</td>
    <td>${dTotMeta !== null ? '<span class="' + (dTotMeta > 0 ? 'pos' : 'neg') + '">' + (dTotMeta > 0 ? '+' : '') + fmt(dTotMeta) + '</span>' : '—'}</td>
  </tr>`);

  // Table
  const allSups = [...new Set(filtered.map(r => r.fornecedor))].sort();
  const monthRange = [];
  for (let i = mMin; i <= mMax; i++) monthRange.push(i);
  const thead = document.querySelector('#tbl-' + p.key + ' thead');
  const tbody = document.querySelector('#tbl-' + p.key + ' tbody');
  thead.innerHTML = '<tr><th>Fornecedor / Centro de Custo</th>' + monthRange.map(i => '<th>' + MONTHS[i] + '</th>').join('') + '<th>Total</th></tr>';
  tbody.innerHTML = '';

  const colTots = monthRange.map(() => 0);
  let grandTotal = 0;
  allSups.forEach(s => {
    let rowTot = 0;
    const cells = monthRange.map((mi, idx) => {
      const v = filtered.filter(r => r.fornecedor === s && r.mes === mi).reduce((a, b) => a + b.valor, 0);
      colTots[idx] += v; rowTot += v;
      return '<td>' + (v > 0 ? fmt(v) : '<span style="color:#d1d5db">—</span>') + '</td>';
    });
    grandTotal += rowTot;
    tbody.insertAdjacentHTML('beforeend', '<tr><td><strong>' + s + '</strong></td>' + cells.join('') + '<td><strong>' + fmt(rowTot) + '</strong></td></tr>');
  });
  if (allSups.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + (monthRange.length + 2) + '" style="text-align:center;color:#9ca3af;padding:24px">Nenhum dado para os filtros selecionados</td></tr>';
  } else {
    tbody.insertAdjacentHTML('beforeend',
      '<tr class="total"><td>TOTAL</td>' + colTots.map(v => '<td>' + fmt(v) + '</td>').join('') + '<td>' + fmt(grandTotal) + '</td></tr>');
  }
}

window.saveComment = function(el) {
  const key = el.dataset.key;
  const val = el.value.trim();
  if (val) {
    localStorage.setItem(key, val);
    const ts = new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    localStorage.setItem(key + '_ts', 'Salvo em ' + ts);
    // update timestamp display
    let tsEl = el.nextElementSibling;
    if (!tsEl || !tsEl.classList.contains('comment-ts')) {
      tsEl = document.createElement('div');
      tsEl.className = 'comment-ts';
      el.insertAdjacentElement('afterend', tsEl);
    }
    tsEl.textContent = 'Salvo em ' + ts;
  } else {
    localStorage.removeItem(key);
    localStorage.removeItem(key + '_ts');
    const tsEl = el.nextElementSibling;
    if (tsEl && tsEl.classList.contains('comment-ts')) tsEl.textContent = '';
  }
  // flash toast
  const toast = document.getElementById('save-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
};

// ====== SLIDESHOW ======
let slideItems = [];
let slideIdx = 0;

// ── UNIFIED SLIDESHOW — one slide per package, YTD + Mês side by side ──
function openSlide() {
  document.getElementById('slide-overlay').classList.add('open');
  renderSlide();
  document.addEventListener('keydown', slideKeyHandler);
}
function closeSlide() {
  document.getElementById('slide-overlay').classList.remove('open');
  document.removeEventListener('keydown', slideKeyHandler);
}
function slideKeyHandler(e) {
  if (e.key === 'Escape') closeSlide();
}
function slideMove(dir) {
  slideIdx = Math.max(0, Math.min(PKGS.length - 1, slideIdx + dir));
  renderSlide();
}
function buildDots() {
  document.getElementById('slide-dots').innerHTML = PKGS.map((p, i) =>
    `<div class="slide-dot${i===0?' active':''}" title="${p.label}" onclick="slideGoto(${i})"></div>`
  ).join('');
}
function slideGoto(i) { slideIdx = i; renderSlide(); }

function getCheckedMonths() {
  return [...document.querySelectorAll('#dash-mes-checks input:checked')].map(c => parseInt(c.value));
}

function farIcon(fc) {
  return fc === 'green'
    ? '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#10b981"/><path d="M6 11.5l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
    : fc === 'yellow'
    ? '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#f59e0b"/><text x="11" y="16" text-anchor="middle" font-size="14" fill="#fff" font-weight="900">!</text></svg>'
    : '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#ef4444"/><path d="M7 7l8 8M15 7l-8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
}

function farBg(fc) {
  return fc === 'green' ? 'rgba(16,185,129,0.13)' : fc === 'yellow' ? 'rgba(245,158,11,0.13)' : 'rgba(239,68,68,0.13)';
}
function farColor(fc) {
  return fc === 'green' ? '#6ee7b7' : fc === 'yellow' ? '#fcd34d' : '#fca5a5';
}
function farBorder(fc) {
  return fc === 'green' ? 'rgba(16,185,129,0.5)' : fc === 'yellow' ? 'rgba(245,158,11,0.5)' : 'rgba(239,68,68,0.5)';
}
function farStatus(fc) {
  return fc === 'green' ? 'Dentro da Meta' : fc === 'yellow' ? 'Atenção — Leve Excesso' : 'Excedeu a Meta';
}

function slideBlock(label, real, meta, period) {
  const fc = farClass(real, meta);
  const varVal = real - meta;
  const varSign = varVal > 0 ? '+' : '';
  return `
    <div style="flex:1;background:${farBg(fc)};border:1.5px solid ${farBorder(fc)};border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:220px">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:2.5px;color:rgba(246,240,225,0.5);font-weight:700">${period}</div>
      ${farIcon(fc)}
      <div style="font-size:clamp(26px,4vw,44px);font-weight:900;color:${farColor(fc)};font-family:'Georgia',serif;letter-spacing:-1px;line-height:1">${fmt(real)}</div>
      <div style="font-size:12px;color:rgba(246,240,225,0.55)">Meta: ${fmt(meta)}</div>
      <div style="font-size:clamp(18px,2.5vw,28px);font-weight:900;color:${farColor(fc)}">${pct(real,meta)}</div>
      <div style="font-size:11px;color:rgba(246,240,225,0.6)">${varSign}${fmt(varVal)}</div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:${farColor(fc)}">${farStatus(fc)}</div>
    </div>`;
}

function renderSlide() {
  const LM = 3;
  const checked = getCheckedMonths();
  const mesLabel = checked.length ? checked.map(i => MONTHS[i]).join(' + ') : null;
  const period   = mesLabel ? 'Mês a Mês — ' + mesLabel : 'YTD — Jan a Abr 2026';

  const cards = PKGS.map(p => {
    const m = DATA.meta[p.key];
    let mYtd = 0, rYtd = 0;
    for (let i = 0; i <= LM; i++) { mYtd += m.meta[i]; rYtd += m.real[i]; }

    const mMes = checked.reduce((a, i) => a + m.meta[i], 0);
    const rMes = checked.reduce((a, i) => a + m.real[i], 0);

    const fc   = farClass(mesLabel ? rMes : rYtd, mesLabel ? mMes : mYtd);
    const real = mesLabel ? rMes : rYtd;
    const meta = mesLabel ? mMes : mYtd;
    const varVal  = real - meta;
    const varSign = varVal > 0 ? '+' : '';
    const statusLabel = fc === 'green' ? '✓ OK' : fc === 'yellow' ? '⚠ Atenção' : '✕ Excedeu';

    return `
      <div class="slide-pkg-card fc-${fc}" onclick="closeSlide();switchPage('${p.key}')">
        <div class="spc-name">${p.full}</div>
        <div class="spc-val-row">
          <span class="spc-dot fc-${fc}"></span>
          <span class="spc-val">${fmtK(real)}</span>
        </div>
        <div class="spc-meta">Meta: ${fmtK(meta)} &nbsp;·&nbsp; ${pct(real, meta)}</div>
        <div class="spc-meta" style="color:${varVal>0?'#ef4444':'#10b981'};font-weight:600">${varSign}${fmt(varVal)}</div>
        <div class="spc-status fc-${fc}">${statusLabel}</div>
      </div>`;
  }).join('');

  document.getElementById('slide-period-label').textContent = period;
  document.getElementById('slide-subtitle').textContent = period + ' · 8 Pacotes';
  document.getElementById('slide-ts').textContent = new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  document.getElementById('slide-stage').innerHTML = `
    <div class="slide-animate" style="width:100%;max-width:1280px">
      <div class="slide-cards-grid">${cards}</div>
    </div>`;
}

  document.querySelectorAll('#dash-mes-checks input[type=checkbox]').forEach(cb => cb.checked = true);
  renderDashMes();
};
window.clearMeses = function() {
